{% extends "admin_base.html" %}
{% block title %}Edit Product · Admin{% endblock %}

{% block content %}
<div class="page-header">
  <h1>✏ Edit Product</h1>
  <a href="/admin/products" class="btn btn-outline">← Back to Products</a>
</div>

<div class="card" style="max-width:600px">
  <div class="card-body">
    <form action="/admin/products/edit/{{ product.id }}" method="post">
      <div class="form-group">
        <label>Product Name *</label>
        <input name="name" type="text" class="form-control" value="{{ product.name }}" required>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" class="form-control" rows="3">{{ product.description or '' }}</textarea>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div class="form-group">
          <label>Price (₹) *</label>
          <input name="price" type="number" step="0.01" min="0" class="form-control" value="{{ product.price }}" required>
        </div>
        <div class="form-group">
          <label>Stock *</label>
          <input name="stock" type="number" min="0" class="form-control" value="{{ product.stock }}" required>
        </div>
      </div>
      <div class="form-group">
        <label>Image URL</label>
        <input name="image_url" type="url" class="form-control" value="{{ product.image_url or '' }}">
        {% if product.image_url %}
          <img src="{{ product.image_url }}" alt="preview" style="margin-top:.5rem;height:80px;border-radius:6px;object-fit:cover">
        {% endif %}
      </div>
      <div class="form-group">
        <label>Category *</label>
        <select name="category_id" class="form-control" required>
          {% for cat in categories %}
            <option value="{{ cat.id }}" {% if product.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div style="display:flex;gap:1rem">
        <button type="submit" class="btn btn-primary">💾 Save Changes</button>
        <a href="/admin/products" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
