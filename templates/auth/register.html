<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register · ShopEase</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-box">
    <div class="logo">
      <h1>🛒 Shop<span>Ease</span></h1>
      <p>Create your free account</p>
    </div>

    {% if error %}
    <div class="alert alert-danger">⚠ {{ error }}</div>
    {% endif %}

    <form action="/register" method="post">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text" class="form-control" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" class="form-control" placeholder="Min 6 characters" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">🚀 Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Sign in →</a>
    </div>
  </div>
</div>
</body>
</html>
