<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ShopEase{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
</head>
<body>

<nav class="navbar">
  <a href="/" class="brand">🛒 Shop<span>Ease</span></a>
  <button class="hamburger" aria-label="Menu">☰</button>
  <div class="nav-links">
    <a href="/">🏠 Home</a>
    {% if user %}
      <a href="/cart">🛒 Cart <span class="cart-badge" id="cart-count">0</span></a>
      <a href="/orders">📦 Orders</a>
      {% if user.is_admin %}
        <a href="/admin/dashboard" class="btn-nav">⚙ Admin</a>
      {% endif %}
      <a href="/logout">👋 Logout ({{ user.name.split()[0] }})</a>
    {% else %}
      <a href="/login">🔑 Login</a>
      <a href="/register" class="btn-nav">Sign Up</a>
    {% endif %}
  </div>
</nav>

{% block content %}{% endblock %}

<footer class="footer">
  <p>© 2024 ShopEase · Built with <a href="https://fastapi.tiangolo.com">FastAPI</a></p>
</footer>

<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
